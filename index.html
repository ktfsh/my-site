<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My learning timeline</title>
<style>
  /* COLOURS: change these values to restyle the whole page */
  :root {
    --bg: #f2f6f7;
    --card: #ffffff;
    --ink: #1b2a34;
    --muted: #5d6f7a;
    --line: #c9d6db;
    --accent: #0f7b8a;
    --done: #5b4b8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12191d;
      --card: #1b252b;
      --ink: #e6eef1;
      --muted: #93a6b0;
      --line: #33444d;
      --accent: #4cc3d3;
      --done: #b3a2e8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 18px 64px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 2rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    display: grid;
    gap: 10px;
    margin-bottom: 28px;
  }
  label { font-size: 0.9rem; color: var(--muted); display: grid; gap: 4px; }
  input, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    padding: 9px 14px;
    font-weight: 600;
  }
  button.quiet {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-weight: 400;
    padding: 4px 10px;
    font-size: 0.85rem;
  }

  .count { color: var(--muted); font-size: 0.95rem; margin: 0 0 14px; }

  /* The timeline: one vertical line with a dot per entry */
  ol { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 3px solid var(--line); }
  li { position: relative; margin: 0 0 18px; padding-left: 16px; }
  li::before {
    content: "";
    position: absolute;
    left: -32px;
    top: 8px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
  }
  li.done::before { background: var(--done); }
  .date { font-size: 0.85rem; color: var(--muted); }
  .title { font-weight: 600; font-size: 1.1rem; }
  li.done .title { color: var(--done); }
  .note { margin: 2px 0 6px; color: var(--muted); white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>My learning timeline</h1>
  <p class="sub">Add what you start learning and watch the timeline grow.</p>

  <form id="add-form">
    <label>What are you learning?
      <input id="what" required maxlength="80" placeholder="e.g. Making my first web page">
    </label>
    <label>Started on
      <input id="started" type="date" required>
    </label>
    <label>Notes (optional)
      <textarea id="note" rows="2" maxlength="300" placeholder="What did you try? What worked?"></textarea>
    </label>
    <button type="submit">Add to timeline</button>
  </form>

  <p class="count" id="count"></p>
  <ol id="timeline"></ol>
</main>

<script>
  // Your entries are saved in THIS browser only (on this device).
  // If you clear your browser data, they are lost.
  const KEY = "learning-timeline";
  let entries = [];

  function load() {
    try {
      entries = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch (e) {
      entries = [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(entries));
    } catch (e) {
      // Saving can fail in private windows. The page still works until you close it.
    }
  }

  function formatDate(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }

  function render() {
    const list = document.getElementById("timeline");
    list.innerHTML = "";

    // Newest first
    const sorted = entries.slice().sort((a, b) => b.started.localeCompare(a.started));

    const doneCount = entries.filter(e => e.done).length;
    document.getElementById("count").textContent = entries.length === 0
      ? ""
      : entries.length + " started, " + doneCount + " finished";

    if (sorted.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "Nothing here yet. Add the first thing you\u2019re learning above.";
      list.appendChild(empty);
      return;
    }

    sorted.forEach(entry => {
      const li = document.createElement("li");
      if (entry.done) li.className = "done";

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = formatDate(entry.started);

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = entry.what;

      li.appendChild(date);
      li.appendChild(title);

      if (entry.note) {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = entry.note;
        li.appendChild(note);
      }

      const actions = document.createElement("div");
      actions.className = "actions";

      const toggle = document.createElement("button");
      toggle.className = "quiet";
      toggle.textContent = entry.done ? "Mark as learning" : "Mark as finished";
      toggle.addEventListener("click", () => {
        entry.done = !entry.done;
        save();
        render();
      });

      const remove = document.createElement("button");
      remove.className = "quiet";
      remove.textContent = "Delete";
      remove.addEventListener("click", () => {
        entries = entries.filter(e => e.id !== entry.id);
        save();
        render();
      });

      actions.appendChild(toggle);
      actions.appendChild(remove);
      li.appendChild(actions);
      list.appendChild(li);
    });
  }

  document.getElementById("add-form").addEventListener("submit", event => {
    event.preventDefault();
    const what = document.getElementById("what").value.trim();
    const started = document.getElementById("started").value;
    const note = document.getElementById("note").value.trim();
    if (!what || !started) return;

    entries.push({ id: Date.now(), what: what, started: started, note: note, done: false });
    save();
    render();

    document.getElementById("what").value = "";
    document.getElementById("note").value = "";
    document.getElementById("what").focus();
  });

  // Default the date box to today
  const today = new Date();
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("started").value =
    today.getFullYear() + "-" + pad(today.getMonth() + 1) + "-" + pad(today.getDate());

  load();
  render();
</script>
</body>
</html>
